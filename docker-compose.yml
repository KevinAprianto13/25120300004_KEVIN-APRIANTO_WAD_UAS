services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gudangku_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    networks:
      - gudangku_network
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  nginx:
    image: nginx:alpine
    container_name: gudangku_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gudangku_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: gudangku_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gudangku
      MYSQL_ROOT_PASSWORD: GudangKu@DB2024
      MYSQL_USER: gudangku_user
      MYSQL_PASSWORD: GudangKu@DB2024
    volumes:
      - gudangku_dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gudangku_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pGudangKu@DB2024"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gudangku_network:
    driver: bridge

volumes:
  gudangku_dbdata:
    driver: local
  vendor_data:
    driver: local
